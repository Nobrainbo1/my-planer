# config/tasks.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Define each task here.
# These values are loaded automatically by @CrewBase in crew.py.
#
# Fields:
#   description:     What the agent must do. Be specific and concrete.
#   expected_output: The exact format and content of the output you expect.
#   agent:           Must match an @agent method name in crew.py.
#   context:         List of task names whose output feeds into this task.
#   output_file:     Optional — writes the task output to a file.
#
# Use {variable_name} for inputs passed via crew.kickoff(inputs={...})
# ──────────────────────────────────────────────────────────────────────────────

research_task:
  description: >
    Conduct thorough, multi-source research on the topic: {topic}.
    Focus on:
    - The latest developments (last 12 months)
    - Key players, projects, and organizations
    - Emerging trends and their potential impact
    - Challenges and open problems
    Use the search tool to gather at least 5 distinct sources.
    Critically evaluate each source for credibility.
  expected_output: >
    A structured research brief containing:
    1. An executive summary (2-3 sentences)
    2. A list of 10 key findings, each with a source citation
    3. A section on emerging trends (3-5 bullet points)
    4. A list of key challenges or open questions
  agent: researcher

reporting_task:
  description: >
    Using the research brief provided as context, write a comprehensive,
    professional report on: {topic}.
    The report should be suitable for a technical audience and structured
    for easy navigation. Include concrete, actionable recommendations
    based on the research findings.
  expected_output: >
    A fully formatted markdown report with:
    - Title and date
    - Executive Summary section
    - Background / Context section
    - Key Findings section (with numbered points)
    - Emerging Trends section
    - Recommendations section (at least 3 concrete actions)
    - Conclusion
    - References list
  agent: reporting_analyst
  context:
    - research_task
  output_file: report.md
